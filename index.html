<style>
/* Layout: barra de club arriba, encabezado de sección, barra de filtros, listado de jugadores con paginado */
:root{
  --rojo:#E30613; --rojo-hondo:#B8050F;
  --bg:#F7F4F3; --surface:#FFFFFF; --fg:#1C1516; --muted:#6E6264;
  --line:#E9E1DF; --soft:#F3ECEA; --on-rojo:#FFFFFF;
  --display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --rojo:#FF3B45; --rojo-hondo:#C80B16; --bg:#141011; --surface:#1F1819; --fg:#F6EFEE; --muted:#B3A6A7; --line:#342A2B; --soft:#2A2122; color-scheme:dark; }
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{background:var(--rojo-hondo);color:var(--on-rojo)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.top img{width:40px;height:40px}
.top b{font:800 1.05rem var(--display);letter-spacing:.01em}

.intro .wrap{padding-block:36px 8px}
.eyebrow{margin:0;font:700 .78rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--rojo)}
.intro h1{margin:4px 0 6px;font:800 clamp(2rem,6vw,3rem)/1.05 var(--display);letter-spacing:-.02em}
.intro p.sub{margin:0;color:var(--muted);max-width:60ch}

.filtros .wrap{padding-block:20px}
.barra{display:grid;grid-template-columns:2fr 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo label{font:600 .75rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.campo input,.campo select{width:100%;font:500 1rem var(--body);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;appearance:none}
.campo select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.campo input:focus,.campo select:focus{outline:none;border-color:var(--rojo)}
.contador{margin:14px 2px 0;font:600 .95rem var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.contador b{color:var(--fg)}
@media (max-width:560px){.barra{grid-template-columns:1fr}}

.grilla{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ficha{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ficha:last-child{border-bottom:0}
.avatar{width:44px;height:44px;flex:none;border-radius:50%;background:var(--soft);color:var(--rojo);display:grid;place-items:center;font:800 .95rem var(--display);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.datos{display:flex;flex-direction:column;min-width:0;flex:1}
.deporte{font:600 .72rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ficha h2{margin:0;font:700 1.05rem/1.25 var(--display);overflow-wrap:anywhere}
.cat{flex:none;font:700 .78rem var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--rojo);border:1.5px solid currentColor;border-radius:6px;padding:2px 8px;font-style:normal}
.vacio{text-align:center;color:var(--muted);padding:40px 12px}
.vacio strong{display:block;color:var(--fg);font:700 1.15rem var(--display);margin-bottom:4px}

.pager{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding-block:28px 8px}
.pager button{appearance:none;min-width:40px;height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:600 .95rem var(--display);cursor:pointer;font-variant-numeric:tabular-nums}
.pager button[aria-current="page"]{background:var(--rojo);border-color:var(--rojo);color:var(--on-rojo)}
.pager button:disabled{opacity:.4;cursor:default}
.pager .dots{color:var(--muted);padding:0 4px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--rojo);outline-offset:2px}

footer{margin-top:40px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer .wrap{padding-block:20px 32px;display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between}
footer b{color:var(--fg);font-weight:600}
</style>
</head>

  {"nombre": "Cesar", "apellido": "Ludueña", "categoria": "8va", "foto": ""},
  {"nombre": "Emanuel", "apellido": "Maran", "categoria": "8va", "foto": ""},
  {"nombre": "Mauricio", "apellido": "Roldan", "categoria": "8va", "foto": ""},
  {"nombre": "Fernando", "apellido": "Rosati", "categoria": "8va", "foto": ""},
  {"nombre": "Juan Roman", "apellido": "", "categoria": "8va", "foto": ""},
  {"nombre": "Hugo", "apellido": "Angius", "categoria": "8va", "foto": ""},
  {"nombre": "Osvaldo", "apellido": "Lopez", "categoria": "8va", "foto": ""},
  {"nombre": "Matias", "apellido": "Changala", "categoria": "8va", "foto": ""}
];
/* =================================================================== */

const $ = s => document.querySelector(s);
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const completo = j => (j.nombre+" "+j.apellido).trim();
const nombreCat = c => (CATEGORIAS.find(x=>x[0]===c)||[c,c])[1];
const state = { q:"", cat:"", pag:1 };

$("#fecha").textContent = CLUB.actualizado;
$("#cat").innerHTML = `<option value="">Todas las categorías</option>` + CATEGORIAS.map(([v,t])=>`<option value="${v}">${t}</option>`).join("");

function iniciales(j){ const p=completo(j).replace(/[^\p{L}\s]/gu,"").trim().split(/\s+/); return ((p[0]||"")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase(); }

const ORDENADOS = JUGADORES.slice().sort((a,b)=>completo(a).localeCompare(completo(b),"es"));

function render(){
  const lista = ORDENADOS.filter(j => (!state.cat || j.categoria===state.cat) && (!state.q || norm(completo(j)).includes(norm(state.q))));
  const total = lista.length, paginas = Math.max(1, Math.ceil(total/CLUB.porPagina));
  if(state.pag>paginas) state.pag=paginas;
  $("#contador").innerHTML = `<b>${total}</b> ${total===1?"jugador":"jugadores"}`;
  const pagina = lista.slice((state.pag-1)*CLUB.porPagina, state.pag*CLUB.porPagina);
  $("#grilla").innerHTML = pagina.length ? pagina.map(j=>`
    <li class="ficha">
      <span class="avatar">${j.foto?`<img src="${esc(j.foto)}" alt="" loading="lazy">`:esc(iniciales(j))}</span>
      <div class="datos"><span class="deporte">Pádel · ${esc(nombreCat(j.categoria))}</span><h2>${esc(completo(j))}</h2></div>
      <em class="cat">${esc(j.categoria)}</em>
    </li>`).join("")
    : `<li class="vacio"><strong>No encontramos jugadores</strong>Probá con otro nombre o elegí otra categoría.</li>`;
  pintarPager(paginas);
}

function pintarPager(n){
  if(n<=1){ $("#pager").innerHTML=""; return; }
  const p=state.pag, nums=new Set([1,n,p-1,p,p+1].filter(x=>x>=1&&x<=n));
  let html=`<button type="button" data-p="${p-1}" ${p===1?"disabled":""}>← Anterior</button>`, prev=0;
  [...nums].sort((a,b)=>a-b).forEach(x=>{ if(x-prev>1) html+=`<span class="dots">…</span>`; html+=`<button type="button" data-p="${x}" ${x===p?'aria-current="page"':""}>${x}</button>`; prev=x; });
  html+=`<button type="button" data-p="${p+1}" ${p===n?"disabled":""}>Siguiente →</button>`;
  $("#pager").innerHTML=html;
}

$("#q").addEventListener("input", e => { state.q=e.target.value.trim(); state.pag=1; render(); });
$("#cat").addEventListener("change", e => { state.cat=e.target.value; state.pag=1; render(); });
$("#pager").addEventListener("click", e => { const b=e.target.closest("button[data-p]"); if(!b||b.disabled) return; state.pag=+b.dataset.p; render(); document.getElementById("resultados").scrollIntoView({behavior:"smooth",block:"start"}); });

/* Links directos: #4ta, #5ta, #6ta, #7ma, #8va */
(function(){ const h=decodeURIComponent((location.hash||"").slice(1)).toLowerCase(); if(CATEGORIAS.some(c=>c[0]===h)){ state.cat=h; $("#cat").value=h; } })();
render();
</script>
